<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九个新镜头 · Motion Library</title><link rel="stylesheet" href="../lib/story-motion.css"><style>body{margin:0;background:#f4f4ef;color:#263428;font:15px/1.6 system-ui}main{max-width:1400px;margin:auto;padding:32px}a{color:inherit}h1{font-size:32px}p{color:#78816c}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{border:1px solid #dce2d5;border-radius:13px;overflow:hidden;background:#fff}.stage{aspect-ratio:16/10}.meta{padding:16px}.meta h2{margin:0;font-size:17px}.meta small{color:#859077}button{background:#354b31;color:white;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;margin-top:12px}a.more{font-size:12px;margin-left:12px}.actions{display:flex;gap:10px;margin-bottom:25px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{padding:20px}.grid{grid-template-columns:1fr}}</style></head><body><main><a href="../">← 返回可调节镜头库</a><h1>九个参考，九种叙事节奏。</h1><p>人物、标题、多图和背景 · 图片与文字均可替换</p><div class="actions"><button id="all">全部播放</button><button id="still">查看关键帧</button></div><div class="grid" id="grid"></div></main><script type="module">
import {StoryMotion} from '../lib/index.mjs';
const names=['惊叹文字横向拉长','人物缩至左下角','多图模糊弹出','开场标题下落','卡片依次展示聚合','图表弹出叠加标题','双侧图片翻转替换','大字冲屏切换封面','背景上移模糊轮播'];const instances=[];const moments=[.7,1,.85,.35,.95,.95,.9,.85,.6];
StoryMotion.presets.forEach((preset,i)=>{const card=document.createElement('article');card.className='card';const stage=document.createElement('div');stage.className='stage';const meta=document.createElement('div');meta.className='meta';const title=document.createElement('h2');title.textContent=String(i+1).padStart(2,'0')+' / '+names[i];const detail=document.createElement('small');detail.textContent=preset;const play=document.createElement('button');play.textContent='播放镜头';const more=document.createElement('a');more.className='more';more.href='../#'+preset;more.textContent='替换素材 / 调参数 ↗';meta.append(title,detail,document.createElement('br'),play,more);card.append(stage,meta);document.querySelector('#grid').append(card);const instance=StoryMotion.mount(stage,{preset});instances.push(instance);instance.timeline.progress(moments[i]);play.onclick=()=>instance.timeline.restart();});
document.querySelector('#all').onclick=()=>instances.forEach(s=>s.timeline.restart());document.querySelector('#still').onclick=()=>instances.forEach((s,i)=>s.timeline.pause().progress(moments[i]));window.addEventListener('beforeunload',()=>instances.forEach(s=>s.destroy()));
</script></body></html>
